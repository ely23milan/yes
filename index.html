    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

      return `ASTRO-${suffix}`;

    async function askCosmoAI(userMessage) {
      const apiKey = ""; // Canvas injects key automatically
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      const currentLessonObj = state.curriculum.lessons.find((l) => l.id === state.selectedLessonId);
      const contextSummary =
        state.activeTab === 'lessons'
          ? `Lesson: ${currentLessonObj?.title}`

          ? `Activity: ${state.curriculum.activities[state.activeActivityTab]?.title}`
          : state.activeTab === 'assessments'
          ? `Assessment: ${state.curriculum.assessments[state.activeAssessmentTab]?.title}`
          : state.activeTab === 'spectrum'
          ? 'Interactive Electromagnetic Spectrum Visualizer'
          : 'ASTROKIT Dashboard';

      const isAssessmentActive = state.activeTab === 'assessments';

      const systemInstruction = `You are COSMO, an enthusiastic, patient, and knowledgeable Grade 9 Science AI Space Learning Guide for "ASTROKIT: Beyond the Visible — Exploring Space Radiation and the Electromagnetic Spectrum".

CRITICAL PEDAGOGICAL RULES:
1. You are a Socratic learning guide, NOT a teacher replacement and NOT an answer-key machine.
2. NEVER directly give away final answers to quizzes, assessments, or activity questions.
3. Keep explanations clear, encouraging, accurate, and tailored to Grade 9 Science students (ages 14-15).
4. Use astronomy examples (stars, nebulae, JWST, Chandra, blackbody radiation, wavelength, frequency, energy).
5. Break ideas into digestible steps and end with a gentle guiding question.
6. Stay strictly within ASTROKIT subject matter.
${isAssessmentActive ? '7. STRICT ASSESSMENT SAFEGUARD ACTIVE: The student currently has an assessment open. Do NOT reveal any answer keys or correct options. Only provide conceptual explanations and guiding questions.' : ''}

Current AI Help Mode: ${state.cosmoMode}
Current Lesson/Activity Context: ${contextSummary}`;

      const payload = {
        contents: [{ parts: [{ text: userMessage }] }],
        systemInstruction: { parts: [{ text: systemInstruction }] }
      };

      let delay = 1000;
      for (let attempt = 0; attempt < 4; attempt++) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const result = await response.json();
          const reply = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (reply) return reply;
          throw new Error('Empty response');
        } catch {
          if (attempt === 3) {
            return "I'm experiencing a brief cosmic signal delay! Remember: across the Electromagnetic Spectrum, shorter wavelengths always mean higher frequency and higher photon energy (c = λf). Which part of the problem would you like to break down first?";
          }
          await new Promise((r) => setTimeout(r, delay));
          delay *= 2;
        }
      }
    }

      const ids = state.enrollments

      const s1 = state.submissions.find(

      if (s1?.data) {
        if (s1.data.rows) state.act1Rows = structuredClone(s1.data.rows);
        if (s1.data.answers) state.act1Answers = [...s1.data.answers];

      const s2 = state.submissions.find(

      const s3 = state.submissions.find(
        (s) => s.studentId === state.userProfile.id && s.classId === state.selectedClassId && s.activityId === 'activity3'

        const activeClass = mine.find((c) => c.id === state.selectedClassId);
        if (!state.userProfile || !activeClass) {
          showToast('Please join a class before saving or submitting activities.', 'error');
          return;
        }
        const titleMap = {
          activity1: state.curriculum.activities.activity1.title,
          activity2: state.curriculum.activities.activity2.title,
          activity3: state.curriculum.activities.activity3.title
        };
        const dataMap = {
          activity1: { rows: state.act1Rows, answers: state.act1Answers },
          activity2: { order: state.act2Order, brief: state.act2Brief },
          activity3: { responses: state.act3Responses }
        };
        const subId = `sub_${activeClass.id}_${state.userProfile.id}_${activityId}`;
        const existing = state.submissions.find((s) => s.id === subId);

        const record = {
          id: subId,
          classId: activeClass.id,
          className: activeClass.name,
          studentId: state.userProfile.id,
          studentName: state.userProfile.name,
          activityId,
          activityTitle: titleMap[activityId],
          data: dataMap[activityId],
          status,
          grade: existing?.grade || '',
          feedback: existing?.feedback || '',
          updatedAt: Date.now(),
          submittedAt: status === 'Submitted' ? Date.now() : existing?.submittedAt || null
        };
        if (db && state.firebaseUser) {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', subId), record);
        }
        showToast(status === 'Submitted' ? `${titleMap[activityId]} submitted!` : 'Draft saved to cloud.');
      },
      setAssessmentTab(tab) {
        state.activeAssessmentTab = tab;
        state.currentQuizIdx = 0;
        render();
      },
      setQuizIdx(idx) {
        state.currentQuizIdx = idx;
        render();
      },
      selectQuizOption(qId, optIdx) {
        state.quizAnswers[qId] = optIdx;
        render();
      },
      async submitAssessment(type) {
        const mine = getMyClasses();
        const activeClass = mine.find((c) => c.id === state.selectedClassId);
        if (!state.userProfile || !activeClass) {
          showToast('Please join a class before submitting assessments.', 'error');
          return;
        }
        const quiz = state.curriculum.assessments[type];
        let correctCount = 0;
        const detailedAnswers = quiz.questions.map((q) => {
          const chosen = state.quizAnswers[q.id];
          const isRight = chosen === q.correctIndex;
          if (isRight) correctCount++;
          return {
            questionId: q.id,
            question: q.question,
            chosenIndex: chosen ?? -1,
            chosenText: chosen !== undefined ? q.options[chosen] : 'No answer selected',
            correctIndex: q.correctIndex,
            correctText: q.options[q.correctIndex],
            isCorrect: isRight,
            explanation: q.explanation
          };
        });
        const percentage = Math.round((correctCount / quiz.questions.length) * 100);
        const resId = `ass_${activeClass.id}_${state.userProfile.id}_${type}`;
        const record = {
          id: resId,
          classId: activeClass.id,
          className: activeClass.name,
          studentId: state.userProfile.id,
          studentName: state.userProfile.name,
          type,
          title: quiz.title,
          score: correctCount,
          total: quiz.questions.length,
          percentage,
          answers: detailedAnswers,
          submittedAt: Date.now()
        };
        if (db && state.firebaseUser) {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'assessments', resId), record);
        }
        showToast(`Assessment submitted! Score: ${correctCount}/${quiz.questions.length} (${percentage}%)`);

        const form = e.target;
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', state.reviewingSubmission.id), {

      selectEditorLesson(id) {

        if (!state.editorDraft) {
          const found = state.curriculum.lessons.find((l) => l.id === state.editorLessonId);
          state.editorDraft = found ? { ...found } : null;
        }
        if (state.editorDraft) state.editorDraft[field] = value;
      },
      toggleEditorPreview() {
        if (!state.editorDraft) {
          const found = state.curriculum.lessons.find((l) => l.id === state.editorLessonId);
          state.editorDraft = found ? { ...found } : null;
        }
        state.editorPreview = !state.editorPreview;
        render();
      },
      async saveCurriculumEdit() {
        if (!state.editorDraft || !db || !state.firebaseUser) return;
        const updatedLessons = state.curriculum.lessons.map((l) =>
          l.id === state.editorDraft.id ? state.editorDraft : l
        );
        await setDoc(
          doc(db, 'artifacts', appId, 'public', 'data', 'curriculum', 'master'),
          { lessons: updatedLessons },
          { merge: true }
        );
        state.editorDraft = null;
        state.editorPreview = false;
        showToast('Lesson content updated across all classrooms!');
      },
      toggleCosmo(open) {
        state.cosmoOpen = open !== undefined ? open : !state.cosmoOpen;
        render();
      },
      setCosmoMode(mode) {
        state.cosmoMode = mode;
        render();
      },
      async sendCosmo(e, presetPrompt = null) {
        if (e) e.preventDefault();
        const inputEl = document.getElementById('cosmo-input');
        const text = (presetPrompt || inputEl?.value || '').trim();
        if (!text || state.cosmoLoading) return;

        state.cosmoMessages.push({ sender: 'user', text });
        if (inputEl) inputEl.value = '';
        state.cosmoLoading = true;
        render();

        if (db && state.firebaseUser && state.userProfile) {
          try {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', state.userProfile.id), {
              aiQueriesCount: (state.userProfile.aiQueriesCount || 0) + 1
            });
          } catch {}
        }

        const reply = await askCosmoAI(text);
        state.cosmoMessages.push({ sender: 'cosmo', text: reply });
        state.cosmoLoading = false;
        render();
      }
    };

    // ========================================================================
    // 7. LIVE ANIMATED WAVE LOOP FOR INTERACTIVE SPECTRUM
    // ========================================================================
    let wavePhase = 0;
    function animateSpectrumWave() {
      wavePhase = (wavePhase + 0.08) % (Math.PI * 20);
      const pathEl = document.getElementById('em-live-wave-path');
      if (pathEl) {
        const wave = state.curriculum.emWaves.find((w) => w.id === state.selectedWaveId) || state.curriculum.emWaves[0];
        const freq = wave.waveFreqVisual || 4;
        let d = 'M 0 55';
        for (let x = 0; x <= 640; x += 6) {
          const y = 55 + Math.sin((x / 640) * Math.PI * 2 * freq - wavePhase) * 34;
          d += ` L ${x} ${y.toFixed(1)}`;
        }
        pathEl.setAttribute('d', d);
        pathEl.setAttribute('stroke', wave.color);
      }
      requestAnimationFrame(animateSpectrumWave);
    }
    window.addEventListener('load', () => {
      requestAnimationFrame(animateSpectrumWave);
    });

              <nav class="p-3 space-y-1">
                ${navItems.map((item) => {
                  const active = state.activeTab === item.id;
                  return `
                    <button onclick="astroActions.setTab('${item.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition ${active ? 'bg-gradient-to-r from-cyan-600/30 to-purple-600/30 border border-cyan-500/40 text-white shadow' : 'text-slate-400 hover:text-white hover:bg-white/5'}">
                      <i data-lucide="${item.icon}" class="w-4 h-4 ${active ? 'text-cyan-400' : ''}"></i>
                      <span>${escapeHtml(item.label)}</span>
                    </button>
                  `;
                }).join('')}
              </nav>
            </div>

            <div class="p-4 border-t border-white/10 space-y-3">
              <button onclick="astroActions.toggleReadingMode()" class="w-full flex items-center justify-between px-3 py-2 rounded-xl border text-xs font-medium transition ${state.readingMode ? 'bg-amber-500/15 border-amber-400/40 text-amber-200' : 'bg-white/5 border-white/10 text-slate-300 hover:bg-white/10'}">
                <span>Reading-Friendly Mode</span>
                <span class="font-bold">${state.readingMode ? 'ON' : 'OFF'}</span>
              </button>

              <div class="flex items-center justify-between bg-slate-950/80 p-3 rounded-xl border border-white/10">
                <div class="min-w-0">
                  <div class="text-xs font-bold text-white truncate">${escapeHtml(state.userProfile.name)}</div>
                  <div class="text-[11px] text-cyan-400 capitalize flex items-center gap-1">${escapeHtml(state.userProfile.role)}</div>
                </div>
                <button onclick="astroActions.logout()" title="Sign Out" class="p-2 rounded-lg text-slate-400 hover:text-red-400 hover:bg-white/5 transition">
                  <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </aside>

          <!-- Main Content -->
          <div class="flex-1 flex flex-col min-w-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-950/40 via-slate-950 to-slate-950">
            <header class="sticky top-0 z-30 bg-slate-950/80 backdrop-blur-md border-b border-white/10 px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <button onclick="astroActions.toggleMobileMenu(true)" class="lg:hidden p-2 rounded-xl bg-white/5 border border-white/10 text-slate-200"><i data-lucide="menu" class="w-5 h-5"></i></button>
                <div>
                  <h1 class="text-base sm:text-lg font-bold text-white">${isTeacher ? 'MISSION CONTROL — TEACHER DASHBOARD' : 'MY SPACE MISSION'}</h1>
                  <p class="text-xs text-slate-400 hidden sm:block">Exploring Space Radiation and the Electromagnetic Spectrum</p>
                </div>
              </div>

              <div class="flex items-center gap-2.5">
                ${isTeacher ? `
                  <button onclick="astroActions.openCreateClassModal(true)" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-xs font-bold shadow-lg shadow-cyan-500/20">
                    <i data-lucide="plus" class="w-4 h-4"></i> Create Class
                  </button>
                ` : ''}
                <button onclick="astroActions.toggleCosmo()" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-purple-600/25 border border-purple-400/40 hover:bg-purple-600/35 text-purple-200 text-xs font-bold">
                  <i data-lucide="bot" class="w-4 h-4 text-purple-300"></i>
                  <span class="hidden sm:inline">Ask Cosmo AI</span>
                </button>
              </div>
            </header>

            <main class="flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto space-y-8 pb-24">
              ${bodyHtml}
            </main>
          </div>

          ${modalsHtml}
          ${cosmoHtml}
        </div>
      `;
    }

    // ========================================================================
    // 9. ROOT RENDERER
    // ========================================================================
    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      if (!state.authReady) return;
      if (!state.userProfile) {
        root.innerHTML = renderAuthGateway();
      } else {
        root.innerHTML = renderMainApp();
      }

      if (window.lucide) {
        window.lucide.createIcons();
      }
      const feed = document.getElementById('cosmo-feed');
      if (feed) {
        feed.scrollTop = feed.scrollHeight;
      }
    }
  </script>
</body>
</html>
